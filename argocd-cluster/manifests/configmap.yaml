apiVersion: v1
kind: ConfigMap
metadata:
  name: tfm-slm-config
  namespace: tfm-slm
data:
  DATASETS_DIR: "/app/data/.datasets"
  TRUST_REMOTE_CODE: "True"
  CHECKPOINT_BUCKET: "tfm-slm-checkpoints"
  DATASET_BUCKET: "tfm-slm-datasets"
  BENCHMARK_BUCKET: "tfm-slm-benchmarks"
  GPU_VRAM_GB: "16" # Configured lower for local setups, or adjust as needed
  CHECKPOINT_PATH: "/app/data/checkpoint.pt"

